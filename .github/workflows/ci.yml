name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Pack and exercise installed CLI
        shell: bash
        run: |
          package=$(npm pack --silent)
          prefix=$(mktemp -d)
          npm install --prefix "$prefix" "$PWD/$package"
          "$prefix/node_modules/.bin/discourse-axi" --help
