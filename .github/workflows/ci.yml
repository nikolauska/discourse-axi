name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: |
          mkdir -p /tmp/discourse-axi-smoke
          npm pack --pack-destination /tmp/discourse-axi-smoke
          npm install --prefix /tmp/discourse-axi-smoke /tmp/discourse-axi-smoke/*.tgz
          /tmp/discourse-axi-smoke/node_modules/.bin/discourse-axi --help

  release:
    if: github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm publish --provenance
      - run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
